[build-system]
requires = ["setuptools==84.2.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exif-turbo"
version = "1.21.1"
description = "Local-first photo and video library indexing with EXIF metadata and AI image search"
requires-python = ">=3.11"
keywords = ["EXIF", "image search", "photo management", "metadata", "semantic search", "privacy", "video"]
dependencies = [
  "PySide6>=6.11",
  "Pillow>=13.0",
  "rawpy>=0.27",
  "av>=18.0",
  "sqlcipher3>=0.6",
  "markdown>=3.10",
  "cryptography>=49.0",
  "pyvips>=3.1",
  "pyvips-binary>=8.18",
  "faiss-cpu>=1.14",
  "open-clip-torch>=3.3",
  "transformers[sentencepiece]>=4.51,<6",
  "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/baddonkey/exif-turbo"
Repository = "https://github.com/baddonkey/exif-turbo"
Issues = "https://github.com/baddonkey/exif-turbo/issues"
Releases = "https://github.com/baddonkey/exif-turbo/releases"
Documentation = "https://github.com/baddonkey/exif-turbo/blob/main/docs/user-manual.md"

[project.scripts]
exif-turbo = "exif_turbo.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
build = [
  "pyinstaller",
  "babel",
  "packaging",
  "torch",
  "torchvision",
  "setuptools==84.2.0",
  "wheel==0.48.0",
  "uv==0.13.4",
]
dev = ["exif-turbo[build]", "pytest", "pytest-qt", "pytest-timeout"]

[tool.uv]
constraint-dependencies = ["torch>=2.6.0"]
build-constraint-dependencies = [
  "setuptools==84.2.0",
  "wheel==0.48.0",
  "packaging==26.2",
]
environments = [
  "platform_python_implementation == 'CPython' and sys_platform == 'win32' and platform_machine == 'AMD64'",
  "platform_python_implementation == 'CPython' and sys_platform == 'linux' and platform_machine == 'x86_64'",
  "platform_python_implementation == 'CPython' and sys_platform == 'linux' and platform_machine == 'aarch64'",
  "platform_python_implementation == 'CPython' and sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.setuptools.package-data]
exif_turbo = [
  "assets/*.gz",
  "i18n/locales/**/*.mo",
  "i18n/locales/**/*.po",
]

[tool.pytest.ini_options]
# Fail (with a stack dump) instead of hanging forever if a test wedges on a
# leaked native thread (e.g. QtWebEngine GPU/vsync) or a blocked IPC recv.
timeout = 120
timeout_method = "thread"
