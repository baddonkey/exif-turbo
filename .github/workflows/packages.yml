name: Native Packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/packages.yml'
      - '*.spec'
      - 'installer/**'
      - 'scripts/build_*.py'
      - 'scripts/smoke_release.py'
      - 'scripts/release_environment.py'
      - 'scripts/audit_release_artifact.py'
      - 'scripts/stage_runtime_licenses.py'
      - 'hooks/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: native-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONIOENCODING: utf-8
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
          enable-cache: true
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install 7zip --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tool install --global wix --version 6.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add WixToolset.UI.wixext/6.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\Program Files\7-Zip' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Linux build and runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlcipher-dev rpm cpio dpkg-dev \
            libegl1 libopengl0 libgl1 libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-shape0 \
            libxcb-render-util0 libxcb-image0 libx11-xcb1 libnss3 libasound2t64 \
            libxrandr2 libxcomposite1 libxdamage1 libxtst6 \
            libsnappy1v5 libwebpdemux2 libwebpmux3 liblcms2-2 \
            libopus0 libminizip1t64 libpulse0
      - name: Build and audit Windows MSI
        if: runner.os == 'Windows'
        run: uv run --locked --no-default-groups --extra build --python 3.13 --no-managed-python python -u scripts/build_windows.py
      - name: Build and audit Linux DEB and RPM
        if: runner.os == 'Linux'
        run: uv run --locked --no-default-groups --extra build --python 3.13 --no-managed-python python -u scripts/build_linux.py
      - name: Build, sign and audit macOS ARM64 DMG
        if: runner.os == 'macOS'
        run: uv run --locked --no-default-groups --extra build --python 3.13 --no-managed-python python -u scripts/build_macos.py --arch arm64
      - name: Upload native installers
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            dist/*.msi
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
